<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Dark background pill -->
  <rect width="240" height="240" rx="28" fill="#0d0d0d"/>

  <!-- Arched "FAMILY" text along top curve -->
  <defs>
    <path id="arc" d="M 30,130 A 90,90 0 0,1 210,130"/>
  </defs>
  <text font-family="'Arial Black', Arial, sans-serif" font-size="26" font-weight="900"
        letter-spacing="5" fill="#e8637a">
    <textPath href="#arc" startOffset="50%" text-anchor="middle">FAMILY</textPath>
  </text>

  <!-- Large "Vibes" cursive -->
  <text x="120" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="74"
        font-style="italic" font-weight="700" fill="#6dd5c5" text-anchor="middle"
        letter-spacing="-2">Vibes</text>

  <!-- Pink heart (upper-right of Vibes) -->
  <g transform="translate(163, 82) scale(0.55)">
    <path d="M20,6 C20,-4 4,-8 0,4 C-4,-8 -20,-4 -20,6 C-20,18 0,34 0,34 C0,34 20,18 20,6Z"
          fill="#e8637a"/>
  </g>

  <!-- Gold/yellow heart (lower, slightly larger) -->
  <g transform="translate(175, 97) scale(0.72)">
    <path d="M20,6 C20,-4 4,-8 0,4 C-4,-8 -20,-4 -20,6 C-20,18 0,34 0,34 C0,34 20,18 20,6Z"
          fill="#f5c842"/>
  </g>

  <!-- "MAKING" sub-text -->
  <text x="120" y="192" font-family="'Arial Black', Arial, sans-serif" font-size="20"
        font-weight="900" letter-spacing="4" fill="#e8637a" text-anchor="middle">MAKING</text>

  <!-- "MEMORIES TOGETHER" -->
  <text x="120" y="215" font-family="'Arial Black', Arial, sans-serif" font-size="13"
        font-weight="700" letter-spacing="2" fill="#f5c842" text-anchor="middle">MEMORIES TOGETHER</text>
</svg>
